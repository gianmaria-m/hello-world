<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello, World. — gianmaria-m/hello-world</title>
  <meta name="description" content="Una pagina Hello World essenziale, elegante e interattiva per il repository gianmaria-m/hello-world.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-frame" id="hello-card">
    <header class="header-meta">
      <a class="repo-label" href="index.html">gianmaria-m/hello-world</a>
      <nav class="site-nav" aria-label="Navigazione principale">
        <a class="nav-link" id="nav-home" href="index.html" aria-current="page">Home</a>
        <a class="nav-link" id="nav-about" href="about.html">About</a>
      </nav>
    </header>

    <section class="hero" id="hero-section" aria-live="polite">
      <h1 class="greeting-title" id="greeting-title">
        Hello, World<span class="punctuation">.</span>
      </h1>
      <p class="greeting-subtitle" id="greeting-subtitle">
        The starting point of a new project. Clean, readable, and ready to grow.
      </p>
    </section>

    <hr class="divider">

    <section class="controls-section" aria-label="Seleziona la lingua del saluto">
      <span class="controls-label">Cambia saluto</span>
      <div class="lang-list" role="group" aria-label="Lingue disponibili">
        <button type="button" class="lang-btn" id="btn-lang-en" data-lang="en" aria-pressed="true">English</button>
        <button type="button" class="lang-btn" id="btn-lang-it" data-lang="it" aria-pressed="false">Italiano</button>
        <button type="button" class="lang-btn" id="btn-lang-fr" data-lang="fr" aria-pressed="false">Français</button>
        <button type="button" class="lang-btn" id="btn-lang-es" data-lang="es" aria-pressed="false">Español</button>
        <button type="button" class="lang-btn" id="btn-lang-de" data-lang="de" aria-pressed="false">Deutsch</button>
        <button type="button" class="lang-btn" id="btn-lang-ja" data-lang="ja" aria-pressed="false">日本語</button>
      </div>
    </section>

    <footer class="page-footer">
      <span>HTML5 · CSS · JS</span>
      <time class="time-readout" id="local-clock" aria-label="Ora locale"></time>
    </footer>
  </main>

  <script>
    const GREETINGS = {
      en: {
        text: "Hello, World",
        punct: ".",
        subtitle: "The starting point of a new project. Clean, readable, and ready to grow."
      },
      it: {
        text: "Ciao, Mondo",
        punct: ".",
        subtitle: "Il punto di partenza di un nuovo progetto. Semplice, leggibile e pronto a crescere."
      },
      fr: {
        text: "Bonjour, le Monde",
        punct: ".",
        subtitle: "Le point de départ d’un nouveau projet. Simple, lisible et prêt à évoluer."
      },
      es: {
        text: "Hola, Mundo",
        punct: ".",
        subtitle: "El punto de partida de un nuevo proyecto. Limpio, claro y listo para crecer."
      },
      de: {
        text: "Hallo, Welt",
        punct: ".",
        subtitle: "Der Ausgangspunkt für ein neues Projekt. Klar, reduziert und bereit zu wachsen."
      },
      ja: {
        text: "こんにちは、世界",
        punct: "。",
        subtitle: "新しいプロジェクトの最初のページ。シンプルで心地よく、ここから広がります。"
      }
    };

    const heroSection = document.getElementById("hero-section");
    const titleEl = document.getElementById("greeting-title");
    const subtitleEl = document.getElementById("greeting-subtitle");
    const clockEl = document.getElementById("local-clock");
    const langButtons = document.querySelectorAll(".lang-btn");

    let switchTimer = null;

    function selectLanguage(langKey) {
      const entry = GREETINGS[langKey];
      if (!entry) return;

      langButtons.forEach((btn) => {
        btn.setAttribute("aria-pressed", String(btn.dataset.lang === langKey));
      });

      clearTimeout(switchTimer);
      heroSection.classList.add("is-switching");

      switchTimer = setTimeout(() => {
        titleEl.textContent = entry.text;
        const punctSpan = document.createElement("span");
        punctSpan.className = "punctuation";
        punctSpan.textContent = entry.punct;
        titleEl.appendChild(punctSpan);

        subtitleEl.textContent = entry.subtitle;
        heroSection.classList.remove("is-switching");
      }, 150);
    }

    langButtons.forEach((btn) => {
      btn.addEventListener("click", () => selectLanguage(btn.dataset.lang));
    });

    function updateClock() {
      const now = new Date();
      clockEl.dateTime = now.toISOString();
      clockEl.textContent = now.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
